<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes</h2>
        <a th:href="@{/clientes/novo}" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <span th:text="${sucesso}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <span th:text="${erro}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div id="alertaErro" class="alert alert-danger" style="display:none;"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr><th class="ps-4">Nome</th><th>Telefone</th><th>Endereço</th><th class="text-end pe-4">Ações</th></tr>
                </thead>
                <tbody id="clientes-tabela"></tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            const API_URL = '/api/clientes';
            const podeEditar = /*[[${#authorization.expression('hasRole(''ATENDENTE'')')}]]*/ false;
            const podeExcluir = /*[[${#authorization.expression('hasRole(''GERENTE'')')}]]*/ false;
            const tabela = document.getElementById('clientes-tabela');

            function formatarEndereco(c) {
                const partes = [c.logradouro, c.numero, c.complemento, c.bairro, c.cidade, c.estado]
                    .filter(p => p && String(p).trim() !== '');
                return partes.length > 0 ? partes.join(', ') : (c.endereco || '—');
            }

            async function carregarClientes() {
                try {
                    const clientes = await apiFetch(API_URL);
                    tabela.innerHTML = '';
                    if (!clientes.length) {
                        tabela.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-5">'
                            + '<i class="bi bi-inbox fs-3 d-block mb-2"></i>Nenhum cliente cadastrado.</td></tr>';
                        return;
                    }
                    clientes.forEach(c => {
                        const row = document.createElement('tr');
                        // escapeHtml evita XSS com dados digitados no cadastro
                        row.innerHTML = `
                            <td class="ps-4">${escapeHtml(c.nome || '—')}</td>
                            <td>${escapeHtml(c.telefone || '—')}</td>
                            <td>${escapeHtml(formatarEndereco(c))}</td>
                            <td class="text-end pe-4">
                                ${podeEditar ? `<a href="/clientes/editar/${encodeURIComponent(c.id)}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil-fill"></i> Editar</a>` : ''}
                                ${podeExcluir ? `<button class="btn btn-sm btn-outline-danger" data-id="${escapeHtml(c.id)}"><i class="bi bi-trash-fill"></i> Excluir</button>` : ''}
                            </td>`;
                        const botao = row.querySelector('button[data-id]');
                        if (botao) botao.addEventListener('click', () => excluirCliente(botao.dataset.id));
                        tabela.appendChild(row);
                    });
                } catch (e) {
                    mostrarErro(e.message);
                }
            }

            async function excluirCliente(id) {
                if (!confirm('Tem certeza que deseja excluir este cliente?')) return;
                try {
                    await apiFetch(`${API_URL}/${encodeURIComponent(id)}`, { method: 'DELETE' });
                    carregarClientes();
                } catch (e) {
                    mostrarErro(e.message);
                }
            }

            function mostrarErro(msg) {
                const a = document.getElementById('alertaErro');
                a.textContent = msg;
                a.style.display = 'block';
            }

            carregarClientes();
        })();
    </script>
</div>
</body>
</html>
