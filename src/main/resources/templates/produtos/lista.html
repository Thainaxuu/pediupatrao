<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-boxes me-2 text-primary"></i>Produtos</h2>
        <button class="btn btn-primary" sec:authorize="hasRole('GERENTE')" onclick="novoProduto()">
            <i class="bi bi-plus-lg me-1"></i> Novo produto
        </button>
    </div>

    <div id="alertaErro" class="alert alert-danger" style="display:none; white-space: pre-line;"></div>

    <!-- Formulario: somente GERENTE (a API tambem bloqueia os demais perfis) -->
    <div class="card card-body shadow-sm mb-3" id="formularioProduto" style="display:none;" sec:authorize="hasRole('GERENTE')">
        <input type="hidden" id="produtoId">
        <div class="row g-2">
            <div class="col-md-4"><label class="form-label" for="nome">Nome</label>
                <input type="text" id="nome" class="form-control" maxlength="120"></div>
            <div class="col-md-3"><label class="form-label" for="tipo">Tipo</label>
                <select id="tipo" class="form-select">
                    <option>Pizza</option><option>Esfiha</option><option>Lanche</option>
                    <option>Bebida</option><option>Porção</option><option>Sobremesa</option><option>Adicional</option>
                </select></div>
            <div class="col-md-2"><label class="form-label" for="preco">Preço (R$)</label>
                <input type="number" id="preco" class="form-control" step="0.01" min="0.01"></div>
            <div class="col-md-1 d-flex align-items-end"><div class="form-check mb-2">
                <input type="checkbox" id="ativo" class="form-check-input" checked>
                <label for="ativo" class="form-check-label">Ativo</label></div></div>
            <div class="col-md-2 d-flex align-items-end gap-2">
                <button class="btn btn-success w-100" onclick="salvarProduto()">Salvar</button>
                <button class="btn btn-outline-secondary" onclick="fecharFormulario()"><i class="bi bi-x"></i></button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr><th class="ps-4">Nome</th><th>Tipo</th><th class="text-end">Preço</th><th>Ativo</th>
                        <th class="text-end pe-4" sec:authorize="hasRole('GERENTE')">Ações</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td></tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td class="text-end" th:text="${@fmt.moedaDouble(produto.preco)}"></td>
                        <td><span class="badge" th:classappend="${produto.disponivel} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${produto.disponivel} ? 'Sim' : 'Não'"></span></td>
                        <td class="text-end pe-4" sec:authorize="hasRole('GERENTE')">
                            <button class="btn btn-sm btn-outline-primary me-1"
                                    th:attr="data-id=${produto.id},data-nome=${produto.nome},data-tipo=${produto.tipo},data-preco=${produto.preco},data-ativo=${produto.disponivel}"
                                    onclick="editarProduto(this.dataset)"><i class="bi bi-pencil-fill"></i> Editar</button>
                            <button class="btn btn-sm btn-outline-danger" th:attr="data-id=${produto.id}"
                                    onclick="excluirProduto(this.dataset.id)"><i class="bi bi-trash-fill"></i> Excluir</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function mostrarErro(msg) {
            const a = document.getElementById('alertaErro');
            a.textContent = msg;
            a.style.display = 'block';
        }
        function novoProduto() {
            document.getElementById('produtoId').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('preco').value = '';
            document.getElementById('ativo').checked = true;
            document.getElementById('formularioProduto').style.display = 'block';
        }
        function editarProduto(d) {
            document.getElementById('produtoId').value = d.id;
            document.getElementById('nome').value = d.nome;
            document.getElementById('tipo').value = d.tipo;
            document.getElementById('preco').value = d.preco;
            document.getElementById('ativo').checked = d.ativo === 'true';
            document.getElementById('formularioProduto').style.display = 'block';
        }
        function fecharFormulario() {
            document.getElementById('formularioProduto').style.display = 'none';
        }
        async function salvarProduto() {
            const id = document.getElementById('produtoId').value;
            const corpo = {
                nome: document.getElementById('nome').value,
                tipo: document.getElementById('tipo').value,
                preco: parseFloat(document.getElementById('preco').value),
                ativo: document.getElementById('ativo').checked
            };
            try {
                await apiFetch(id ? '/api/produtos/' + encodeURIComponent(id) : '/api/produtos',
                    { method: id ? 'PUT' : 'POST', body: JSON.stringify(corpo) });
                window.location.reload();
            } catch (e) { mostrarErro(e.message); }
        }
        async function excluirProduto(id) {
            if (!confirm('Excluir este produto? Pedidos já registrados não são afetados.')) return;
            try {
                await apiFetch('/api/produtos/' + encodeURIComponent(id), { method: 'DELETE' });
                window.location.reload();
            } catch (e) { mostrarErro(e.message); }
        }
    </script>
</div>
</body>
</html>
