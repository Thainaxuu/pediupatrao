<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0">Novo pedido</h2>
    </div>

    <div id="alertaErro" class="alert alert-danger" style="display:none; white-space: pre-line;"></div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label for="clienteId" class="form-label fw-medium">Cliente</label>
                        <select id="clienteId" class="form-select" required>
                            <option value="">Selecione o cliente</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}"
                                    th:text="${c.nome + (c.telefone != null ? ' — ' + c.telefone : '')}"></option>
                        </select>
                        <div class="form-text" th:if="${#lists.isEmpty(clientes)}">
                            Nenhum cliente cadastrado. O cadastro é feito pelo atendente.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-medium d-block">Tipo</label>
                        <div class="form-check form-check-inline" th:each="t, st : ${tiposEntrega}">
                            <input class="form-check-input" type="radio" name="tipoEntrega"
                                   th:id="${'tipo' + t}" th:value="${t}" th:checked="${st.first}">
                            <label class="form-check-label" th:for="${'tipo' + t}" th:text="${t.descricao}"></label>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-medium">Itens</span>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="btnAddItem">
                            <i class="bi bi-plus-lg"></i> Adicionar item
                        </button>
                    </div>
                    <div id="itens"></div>

                    <div class="mb-3 mt-3">
                        <label for="observacao" class="form-label fw-medium">Observação</label>
                        <textarea id="observacao" class="form-control" rows="2" maxlength="500"
                                  placeholder="Ex.: sem cebola, troco para R$ 100"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold">Resumo</h5>
                    <p class="d-flex justify-content-between mb-1"><span>Itens</span><span id="qtdItens">0</span></p>
                    <p class="d-flex justify-content-between fs-5 fw-bold"><span>Total estimado</span><span id="totalEstimado">R$ 0,00</span></p>
                    <p class="small text-muted">O valor final é calculado pelo servidor com base nos preços cadastrados.</p>
                    <button type="button" class="btn btn-success w-100" id="btnSalvar">
                        <i class="bi bi-check-lg me-1"></i>Registrar pedido
                    </button>
                </div>
            </div>
        </div>
    </div>

    <template id="modeloItem">
        <div class="row g-2 align-items-end mb-2 linha-item">
            <div class="col-7">
                <select class="form-select form-select-sm produto">
                    <option value="">Produto</option>
                    <option th:each="p : ${produtos}" th:value="${p.id}" th:attr="data-preco=${p.preco}"
                            th:text="${p.tipo + ' — ' + p.nome + ' (' + @fmt.moedaDouble(p.preco) + ')'}"></option>
                </select>
            </div>
            <div class="col-3">
                <input type="number" class="form-control form-control-sm quantidade" min="1" max="99" value="1">
            </div>
            <div class="col-2 text-end">
                <button type="button" class="btn btn-sm btn-outline-danger remover"><i class="bi bi-trash"></i></button>
            </div>
        </div>
    </template>

    <script>
        (function () {
            const itens = document.getElementById('itens');
            const modelo = document.getElementById('modeloItem');

            function atualizarResumo() {
                let total = 0, qtd = 0;
                itens.querySelectorAll('.linha-item').forEach(linha => {
                    const opcao = linha.querySelector('.produto').selectedOptions[0];
                    const q = parseInt(linha.querySelector('.quantidade').value || '0', 10);
                    if (opcao && opcao.value && q > 0) {
                        total += parseFloat(opcao.dataset.preco) * q;
                        qtd += q;
                    }
                });
                document.getElementById('qtdItens').textContent = qtd;
                document.getElementById('totalEstimado').textContent = formatarMoeda(total);
            }

            function adicionarItem() {
                const linha = modelo.content.firstElementChild.cloneNode(true);
                linha.querySelector('.remover').addEventListener('click', () => { linha.remove(); atualizarResumo(); });
                linha.querySelectorAll('select, input').forEach(el => el.addEventListener('input', atualizarResumo));
                itens.appendChild(linha);
            }

            document.getElementById('btnAddItem').addEventListener('click', adicionarItem);
            adicionarItem();

            document.getElementById('btnSalvar').addEventListener('click', async () => {
                const alerta = document.getElementById('alertaErro');
                alerta.style.display = 'none';
                const corpo = {
                    clienteId: document.getElementById('clienteId').value,
                    tipoEntrega: (document.querySelector('input[name="tipoEntrega"]:checked') || {}).value,
                    observacao: document.getElementById('observacao').value,
                    // Apenas produto e quantidade: preco e total sao definidos pelo servidor.
                    itens: Array.from(itens.querySelectorAll('.linha-item'))
                        .map(l => ({
                            produtoId: l.querySelector('.produto').value,
                            quantidade: parseInt(l.querySelector('.quantidade').value || '0', 10)
                        }))
                        .filter(i => i.produtoId)
                };
                const botao = document.getElementById('btnSalvar');
                botao.disabled = true;
                try {
                    const pedido = await apiFetch('/api/pedidos', { method: 'POST', body: JSON.stringify(corpo) });
                    window.location.href = '/pedidos/' + encodeURIComponent(pedido.id);
                } catch (e) {
                    alerta.textContent = e.message;
                    alerta.style.display = 'block';
                    botao.disabled = false;
                }
            });
        })();
    </script>
</div>
</body>
</html>
